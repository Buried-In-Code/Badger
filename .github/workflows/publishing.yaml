name: Publishing

on: push

env:
  PY_VERSION: "3.14"

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2
      - uses: pdm-project/setup-pdm@v4.5
        with:
          python-version: ${{ env.PY_VERSION }}
      - name: Run build
        run: pdm build
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: python-package-distributions
          path: dist/

  validate:
    needs:
      - build
    permissions: {}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - uses: pdm-project/setup-pdm@v4.5
        with:
          python-version: ${{ env.PY_VERSION }}
      - name: Validate dist
        run: pdm run --with twine twine check dist/*
