name: Linting

on:
  push:
    branches:
      - main
    paths-ignore:
      - docs/**
  pull_request:
    branches:
      - main
    paths-ignore:
      - docs/**

env:
  PY_VERSION: "3.13"

jobs:
  prek:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2
      - uses: pdm-project/setup-pdm@v4.5
        with:
          python-version: ${{ env.PY_VERSION }}
      - name: Install project
        run: pdm install -G :all
      - name: Run prek
        run: pdm run prek run -a
