[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = [
  "mdformat >= 1.0.0",
  "mdformat-gfm >= 1.0.0",
  "mdformat-ruff >= 0.1.0",
  "prek >= 0.4.0",
  "ruff >= 0.16.0",
  "toml-sort >= 0.24.0",
  "ty >= 0.0.70",
]
test = [
  "pytest >= 9.1.0",
  "pytest-cov >= 7.1.0",
]

[project]
authors = [{email = "buriedincode@duckpond.nz", name = "BuriedInCode"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "playwright >= 1.62.0",
]
description = ""
dynamic = ["version"]
keywords = []
license = "MIT"
license-files = ["LICENSE"]
name = "Badger"
readme = "README.md"
requires-python = ">= 3.13"

[project.gui_scripts]
badger = "badger.gui:main"

[project.scripts]
badger = "badger.gui:main"

[tool.coverage.report]
show_missing = true

[tool.coverage.run]
source = ["badger"]

[tool.hatch.build.targets.sdist]
exclude = [".github/"]

[tool.hatch.version]
path = "badger/__init__.py"

[tool.pytest.ini_options]
addopts = ["--cov"]

[tool.ruff]
fix = true
line-length = 100
output-format = "grouped"
show-fixes = true
unsafe-fixes = true

[tool.ruff.format]
docstring-code-format = true
line-ending = "native"
skip-magic-trailing-comma = true

[tool.ruff.lint]
ignore = [
  "COM812",
  "CPY001",
  "D",
  "EM101",
  "EM102",
  "FBT001",
  "FBT002",
  "PLR0913",
  "PLR2004",
  "PLW2901",
  "TRY003",
  "TRY300",
]
select = ["ALL"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
mypy-init-return = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.isort]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
  "classmethod",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.tomlsort]
all = true
ignore_case = true
trailing_comma_inline_array = true

[tool.ty.src]
exclude = ["**/tests/"]
include = ["**/badger"]
